<script>
        // Micro-interactions for toggles and settings buttons
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const parent = this.closest('.w-full');
                if(this.checked) {
                    parent.style.backgroundColor = 'rgba(255, 107, 53, 0.05)';
                } else {
                    parent.style.backgroundColor = 'transparent';
                }
            });
        });

        // Rippling effect simulation for list items
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
                const ripple = document.createElement('span');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('absolute', 'w-2', 'h-2', 'bg-primary/20', 'rounded-full', 'animate-ping', 'pointer-events-none');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
