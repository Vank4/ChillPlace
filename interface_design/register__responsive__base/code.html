<body class="bg-background min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top Navigation (Shell suppressed for transactional flow, but keeping brand identity) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="text-headline-md font-headline-md text-primary tracking-tight">ChillPlace</div>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">help</span>
</button>
</header>
<main class="w-full max-w-md mt-16 mb-8">
<!-- Hero Decorative Section -->
<div class="relative w-full h-48 rounded-[24px] overflow-hidden mb-8 shadow-lg">
<img class="w-full h-full object-cover" data-alt="A vibrant, high-energy photograph of a diverse group of young adults laughing and interacting in a sun-drenched modern workspace. The scene is filled with warm, natural light and features a clean, professional aesthetic with pops of Primary Orange and Trust Blue accents. The overall atmosphere is energetic, welcoming, and community-driven, perfectly reflecting a kinetic Gen-Z lifestyle." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8PKJ3n66goeyT5YB86R7vRHsjrUn4ls1B2wLGi8StKJ9NU1ZJMGTlvEs1MU2DhM4nUInGk64dDwnGRKDTC571Dg57YBAjuI3jIG7UDQmUpOOz8nVVGO-VQ4w28qfqYG21JgH9Swdi47hjRV7kRAXqTIg1b4wsTMuYB46pxzZvxuhW07FvNQ7vEspIxyzeGtd6dOFq04-ARyB8_rHXa5o14aj9guI-T1OYkAF6pmRkhpQkwB6oRuPVd3VfTVQUh2R_ZFVoB7cmfZs"/>
<div class="absolute inset-0 bg-gradient-to-t from-on-background/60 to-transparent flex items-end p-6">
<div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-white leading-tight">Bắt đầu hành trình của bạn</h1>
<p class="text-label-md font-label-md text-white/90">Tham gia cộng đồng khám phá lớn nhất</p>
</div>
</div>
</div>
<!-- Registration Form -->
<section class="bg-surface-container-lowest rounded-[32px] p-8 shadow-[0px_4px_20px_rgba(31,78,121,0.08)]">
<div class="mb-8">
<h2 class="text-headline-md font-headline-md text-on-surface">Tạo tài khoản mới</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Vui lòng điền thông tin để đăng ký</p>
</div>
<form class="space-y-5" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Họ và tên</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all text-body-md font-body-md" placeholder="Nhập tên của bạn" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all text-body-md font-body-md" placeholder="example@email.com" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Số điện thoại</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">call</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all text-body-md font-body-md" placeholder="0901 234 567" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Mật khẩu</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all text-body-md font-body-md" id="passwordInput" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex gap-1 px-1 pt-1" id="strengthIndicator">
<div class="strength-bar flex-1 rounded-full bg-outline-variant"></div>
<div class="strength-bar flex-1 rounded-full bg-outline-variant"></div>
<div class="strength-bar flex-1 rounded-full bg-outline-variant"></div>
<div class="strength-bar flex-1 rounded-full bg-outline-variant"></div>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant ml-1" id="strengthText">Sử dụng ít nhất 8 ký tự</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 py-2">
<div class="relative flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container transition-all cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-label-md font-label-md text-on-surface-variant cursor-pointer" for="terms">
                        Tôi đồng ý với <span class="text-primary-container font-bold hover:underline">Điều khoản</span> &amp; <span class="text-primary-container font-bold hover:underline">Chính sách</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary text-white py-4 rounded-xl text-body-lg font-bold shadow-[0px_8px_24px_rgba(255,107,53,0.15)] active:scale-95 transition-all duration-200 mt-4" type="submit">
                    Đăng ký ngay
                </button>
</form>
<!-- Social Divider -->
<div class="relative my-8 text-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<span class="relative px-4 text-label-sm font-label-sm text-on-surface-variant bg-surface-container-lowest uppercase tracking-wider">Hoặc đăng ký bằng</span>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-outline-variant hover:bg-surface-container transition-all active:scale-95">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsYyrNfdOn4d0Q52BP8LyLa_pfr759rnPnCJpV35f_sDK4ZMH9PVIzy1aoon8W-kWSg31aPubXEfW32_C0cjPlvsLPgn9ETv0Y0zObYIMwdM2g3Aj8v-GpwXc2p4oB275RUQeljQoNG0IoZu7yQgBvcAteJYNBayt1fWJz2Z-dn-vLZDlmEoHj-0Ov1rZQ6HXpssBMv3IstYmdQ8CO0Ndvp1Tsvi5WYEbu19Nn6Fo71q-GbmeZk4FapinT-n7QdOcyKyxIln1YQi8"/>
<span class="text-label-md font-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-outline-variant hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span class="text-label-md font-label-md">Facebook</span>
</button>
</div>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Đã có tài khoản? 
                    <a class="text-primary font-bold hover:underline active:opacity-70" href="#">Đăng nhập ngay</a>
</p>
</div>
</section>
</main>
<!-- Footer decoration -->
<footer class="w-full max-w-md flex justify-center gap-6 pb-12 opacity-40">
<span class="material-symbols-outlined text-secondary">explore</span>
<span class="material-symbols-outlined text-primary">favorite</span>
<span class="material-symbols-outlined text-tertiary">location_on</span>
</footer>
<script>
        // Password strength simulation
        const passwordInput = document.getElementById('passwordInput');
        const strengthBars = document.querySelectorAll('.strength-bar');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', function(e) {
            const val = e.target.value;
            let strength = 0;
            
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            strengthBars.forEach((bar, index) => {
                bar.classList.remove('bg-error', 'bg-primary-container', 'bg-tertiary-container', 'bg-outline-variant');
                if (index < strength) {
                    if (strength === 1) bar.classList.add('bg-error');
                    else if (strength <= 3) bar.classList.add('bg-primary-container');
                    else bar.classList.add('bg-tertiary-container');
                } else {
                    bar.classList.add('bg-outline-variant');
                }
            });

            const texts = ['Quá yếu', 'Yếu', 'Trung bình', 'Khá', 'Mạnh'];
            strengthText.innerText = texts[strength] || 'Sử dụng ít nhất 8 ký tự';
        });

        // Toggle visibility
        const toggleBtn = passwordInput.nextElementSibling;
        toggleBtn.addEventListener('click', () => {
            const icon = toggleBtn.querySelector('.material-symbols-outlined');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        });
    </script>
</body></html>
