<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm flex items-center justify-between px-md h-16">
<button class="text-primary active:scale-95 transition-transform duration-200">

</button>
<h1 class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary">ChillPlace</h1>
<button class="text-primary active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-md pt-24 pb-32 vibe-gradient overflow-hidden">
<!-- Illustration Container -->
<div class="relative w-full max-w-sm mb-lg">
<!-- Background "Splash" effect -->
<div class="absolute inset-0 bg-primary-container/10 blur-3xl rounded-full scale-110"></div>
<div class="relative float-animation flex justify-center">
<img alt="404 Error" class="w-64 h-64 object-cover rounded-3xl shadow-[0px_8px_24px_rgba(255,107,53,0.15)]" data-alt="A stylized 3D illustration of a vibrant, youthful urban explorer holding a holographic digital map that shows a large red question mark. The character is standing on a colorful neon-lit city sidewalk with closed cafe shutters in the background. The lighting is high-energy with warm orange glow and cool blue shadows, matching a modern social media aesthetic. The scene is playful, dynamic, and community-driven with a clean corporate edge." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoxEj9e9ND2TN-GmjbEvYT5poSnHWsevPlm7LpL8xF-zWvZibDXQAwEfh5F3x0tmV5PG_SN8hnif4zuOF29s0t382pe0RSUIcbbjdKCQpDtnE8AOkYmyPCtS0jk1SaAAHk0XnBnnRA9VgSlEyYhBD2YJsLgzQkaGfzTLDVdOxryk2hl5txtVSX3GYIuaI2MNQ085RfJkLQKA0XFSQDn9WPxPvWhNWC9hgI1NLMflRJ1kqpmd7J74QkXZbIee7r6PJMHaUmCg7Mq2I"/>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_off</span>
</div>
<div class="absolute -bottom-2 -left-6 bg-secondary text-on-secondary p-2 rounded-lg shadow-lg -rotate-12">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-md max-w-xs">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Ối! Bạn bị lạc rồi sao?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Trang bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển đi nơi khác.</p>
</div>
<!-- Action Buttons -->
<div class="mt-xl w-full max-w-xs flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary py-md px-xl rounded-xl font-headline-md text-body-lg shadow-[0px_8px_24px_rgba(255,107,53,0.15)] active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">home</span>

            </button>
<button class="w-full bg-transparent border-2 border-secondary text-secondary py-md px-xl rounded-xl font-headline-md text-body-lg active:scale-95 transition-all flex items-center justify-center gap-2">

</a>

<span class="material-symbols-outlined">map</span>

</a>
<!-- Profile (Active State example - although on 404, usually no tab is active, we stay neutral or default) -->

<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
<script>
        // Micro-interaction: Log report click
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.innerText.includes('Báo cáo lỗi')) {
                    console.log('Error reported to ChillPlace team');
                    this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Đã báo cáo';
                    this.classList.replace('text-secondary', 'text-tertiary');
                    this.classList.replace('border-secondary', 'border-tertiary');
                }
            });
        });

        // Interactive "Glitch" effect on 404 text occasionally
        setInterval(() => {
            const h2 = document.querySelector('h2');
            h2.style.transform = `translateX(${Math.random() * 2 - 1}px)`;
            setTimeout(() => h2.style.transform = 'none', 100);
        }, 3000);
    </script>
