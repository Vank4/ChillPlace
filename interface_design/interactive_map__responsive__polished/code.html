<script>
    const bottomSheet = document.getElementById('bottom-sheet');
    const placeName = document.getElementById('place-name');
    const placeAddr = document.getElementById('place-addr');
    const placeCat = document.getElementById('place-category');
    const placeImg = document.getElementById('place-img');

    const places = {
        m1: {
            name: "The Chill Lab",
            addr: "123 Đường Chill, Quận 1, TP.HCM",
            cat: "Cà phê",
            img: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=400",
            color: "bg-primary-fixed",
            textColor: "text-on-primary-fixed"
        },
        m2: {
            name: "Công viên xanh",
            addr: "Lãnh Binh Thăng, Quận 11, TP.HCM",
            cat: "Thiên nhiên",
            img: "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&q=80&w=400",
            color: "bg-tertiary-fixed",
            textColor: "text-on-tertiary-fixed"
        },
        m3: {
            name: "Bếp Việt",
            addr: "456 Nguyễn Trãi, Quận 5, TP.HCM",
            cat: "Ẩm thực",
            img: "https://images.unsplash.com/photo-1567033161394-7c60e33621b4?auto=format&fit=crop&q=80&w=400",
            color: "bg-secondary-fixed",
            textColor: "text-on-secondary-fixed"
        }
    };

    function showPlaceDetail(id) {
        // Clear existing pulses
        document.querySelectorAll('.map-marker-pulse').forEach(p => p.classList.remove('map-marker-pulse'));
        
        // Add pulse to active marker
        const marker = document.getElementById('marker-' + id.replace('m', ''));
        const pulseDiv = marker.querySelector('div > div:first-child');
        pulseDiv.classList.add('map-marker-pulse');

        const data = places[id];
        placeName.innerText = data.name;
        placeAddr.innerText = data.addr;
        placeCat.innerText = data.cat;
        placeImg.src = data.img;
        
        // Apply category styling
        placeCat.className = `${data.color} ${data.textColor} px-3 py-0.5 rounded-full text-label-sm uppercase tracking-wider mb-2 inline-block transition-colors duration-300`;

        bottomSheet.classList.remove('translate-y-full');
        bottomSheet.classList.add('translate-y-0');
    }

    // Close bottom sheet when clicking on the map area
    document.querySelector('main').addEventListener('click', (e) => {
        if (!bottomSheet.contains(e.target) && !e.target.closest('[id^="marker-"]')) {
            bottomSheet.classList.add('translate-y-full');
            bottomSheet.classList.remove('translate-y-0');
            // Remove pulse animations
            document.querySelectorAll('.map-marker-pulse').forEach(p => p.classList.remove('map-marker-pulse'));
        }
    });

    // Touch Handling for Bottom Sheet
    let startY = 0;
    let currentY = 0;
    const sheetContent = bottomSheet.firstElementChild;

    bottomSheet.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
    });

    bottomSheet.addEventListener('touchmove', (e) => {
        currentY = e.touches[0].clientY;
        const deltaY = currentY - startY;
        
        if (deltaY > 0) {
            // Apply slight resistance-free translation during drag
            sheetContent.style.transform = `translateY(${deltaY}px)`;
        }
    });

    bottomSheet.addEventListener('touchend', (e) => {
        const deltaY = currentY - startY;
        sheetContent.style.transform = ''; // Reset inline style
        
        if (deltaY > 100) {
            bottomSheet.classList.add('translate-y-full');
            bottomSheet.classList.remove('translate-y-0');
            document.querySelectorAll('.map-marker-pulse').forEach(p => p.classList.remove('map-marker-pulse'));
        }
    });
</script>
