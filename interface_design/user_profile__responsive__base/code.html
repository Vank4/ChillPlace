<body class="bg-background text-on-surface font-body-md antialiased mb-20">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 shadow-sm bg-surface dark:bg-inverse-surface flex justify-between items-center px-margin-mobile h-16">

</div>
<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
</button>
<button class="hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="pt-16 max-w-screen-md mx-auto">
<!-- Profile Header -->
<section class="px-margin-mobile pt-lg pb-md bg-surface-container-lowest">
<div class="flex flex-col items-center">

</button>
</div>
<!-- Info -->

<h1 class="font-headline-md text-headline-md text-on-surface mb-1">Minh Nguyễn</h1>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm">
                        Thành viên
                    </span>
</div>
<!-- Stats -->
<div class="flex justify-around w-full max-w-sm mb-lg">
<div class="text-center">
<div class="font-headline-md text-headline-md text-primary">12</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Bài viết</div>
</div>
<div class="text-center">
<div class="font-headline-md text-headline-md text-primary">1.2k</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Người theo dõi</div>
</div>
<div class="text-center">
<div class="font-headline-md text-headline-md text-primary">850</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Đang theo dõi</div>
</div>
</div>
<!-- CTA -->
<button class="w-full py-3 px-8 rounded-xl border-2 border-secondary text-secondary font-bold text-body-md hover:bg-secondary/5 active:scale-[0.98] transition-all">
                    Chỉnh sửa hồ sơ

</div>
</section>
<!-- Tabs -->
<nav class="sticky top-16 z-40 bg-surface flex justify-around border-b border-outline-variant/30">

<button class="py-4 px-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">Đã lưu</button>
<button class="py-4 px-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">Đánh giá</button>
</nav>
<!-- Content Grid (Asymmetric / Bento Style) -->
<section class="p-margin-mobile">
<div class="grid grid-cols-2 gap-4">
<!-- Large Feature Card -->

<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex flex-col justify-end p-4">

<span class="material-symbols-outlined text-sm mr-1" data-icon="location_on">location_on</span> Ninh Bình, Việt Nam
                        </span>
<p class="text-white font-body-md line-clamp-1">Chuyến đi tuyệt vời nhất năm nay!</p>

<!-- Secondary Cards -->
<div class="relative group overflow-hidden rounded-xl shadow-sm aspect-square">

<div class="relative group overflow-hidden rounded-xl shadow-sm aspect-square">

</div>
<div class="col-span-2 relative group overflow-hidden rounded-xl shadow-sm aspect-[21/9]">
<img alt="Nature" class="w-full h-full object-cover group-hover:scale-105 transition-transform" data-alt="An ethereal forest scene shrouded in light morning mist, with sunbeams piercing through the dense canopy of ancient trees. The color palette consists of deep forest greens and soft golden rays, creating a serene and mystical atmosphere. The image is crisp and professional, evoking a sense of wonder and quiet exploration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTm3Z1vzXTiITpGDPHoC09DGih0hNBwS5AGH64sp-dvOkrBoYM2877waVwlNeGufzkhtSvFGZhFia8p9cF9JinhYPnitVUc9gf89CRISu_2cbbSl6_B6Uevf9i87egcTITGn74L7PcbWS0qDtEjlO4g4yWnFEl4g5abJAVzgpOhdt975jEjBXNNG-xrNtKcjHaWt48VH21UqTDMhnf_WkBXMMs0BOEUXF5NOA24mMG1KFbQNcBAQp-D22I6zaBoQswOLf5b5FrGX0"/>
<div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors"></div>

</div>

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface dark:bg-inverse-surface shadow-[0px_-4px_20px_rgba(31,78,121,0.08)] rounded-t-xl z-50">
<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low transition-all p-2 rounded-xl active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-label-sm font-label-sm">Trang chủ</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low transition-all p-2 rounded-xl active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="text-label-sm font-label-sm">Khám phá</span>
</div>
<!-- FAB Floating Create Action -->
<div class="relative -top-6">
<button class="bg-primary-container text-on-primary-container w-14 h-14 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px] font-bold" data-icon="add">add</span>
</button>
</div>
<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low transition-all p-2 rounded-xl active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
<span class="text-label-sm font-label-sm">Đã lưu</span>
</div>
<!-- Active Tab: Cá nhân -->
<div class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed-dim text-on-primary-container dark:text-on-primary-fixed rounded-full px-4 py-1 active:scale-90 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-sm font-label-sm">Cá nhân</span>
</div>
</nav>
<script>
        // Simple Interaction Logic for tabs
        document.querySelectorAll('nav button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active classes
                this.parentNode.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('text-primary', 'active-tab');
                    btn.classList.add('text-on-surface-variant');
                });
                // Add active classes to current
                this.classList.add('text-primary', 'active-tab');
                this.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
