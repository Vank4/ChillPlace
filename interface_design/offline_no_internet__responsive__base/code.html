<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary" style="font-size: 80px; font-variation-settings: 'wght' 200;">signal_wifi_off</span>
<div class="mt-4 flex gap-2">
<span class="w-3 h-3 rounded-full bg-primary/40 animate-bounce"></span>
<span class="w-3 h-3 rounded-full bg-primary/60 animate-bounce" style="animation-delay: 0.2s"></span>
<span class="w-3 h-3 rounded-full bg-primary animate-bounce" style="animation-delay: 0.4s"></span>
</div>
</div>
</div>
</div>
<!-- Content Card (Glassmorphism) -->

<p class="font-body-md text-body-md text-on-surface-variant mb-xl leading-relaxed">
                Vui lòng kiểm tra lại đường truyền internet của bạn để tiếp tục khám phá những địa điểm chill nhất.
            </p>

<span class="material-symbols-outlined text-[20px]">refresh</span>

<script>
        function handleRetry() {
            const btn = event.currentTarget;
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin text-[20px]">sync</span>
                Đang kết nối...
            `;
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                    Thử lại
                `;
                btn.classList.remove('opacity-80');
                btn.disabled = false;
                
                // Show a mini toast effect
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 glass-effect px-md py-2 rounded-full shadow-lg text-primary text-label-md z-[100] border-primary/20 transition-all transform translate-y-2 opacity-0';
                toast.innerText = 'Vẫn chưa có kết nối...';
                document.body.appendChild(toast);
                
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                    toast.classList.add('translate-y-0', 'opacity-100');
                });

                setTimeout(() => {
                    toast.classList.add('opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }, 1500);
        }
    </script>
