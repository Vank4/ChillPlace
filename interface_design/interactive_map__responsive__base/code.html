<script>
        const bottomSheet = document.getElementById('bottom-sheet');
        const placeName = document.getElementById('place-name');
        const placeAddr = document.getElementById('place-addr');
        const placeCat = document.getElementById('place-category');
        const placeImg = document.getElementById('place-img');

        const places = {
            m1: {
                name: "The Chill Lab",
                addr: "123 Đường Chill, Quận 1, TP.HCM",
                cat: "Cà phê",
                img: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=400",
                color: "bg-primary-fixed"
            },
            m2: {
                name: "Công viên xanh",
                addr: "Lãnh Binh Thăng, Quận 11, TP.HCM",
                cat: "Thiên nhiên",
                img: "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&q=80&w=400",
                color: "bg-tertiary-fixed"
            },
            m3: {
                name: "Bếp Việt",
                addr: "456 Nguyễn Trãi, Quận 5, TP.HCM",
                cat: "Ẩm thực",
                img: "https://images.unsplash.com/photo-1567033161394-7c60e33621b4?auto=format&fit=crop&q=80&w=400",
                color: "bg-secondary-fixed"
            }
        };

        function showPlaceDetail(id) {
            const data = places[id];
            placeName.innerText = data.name;
            placeAddr.innerText = data.addr;
            placeCat.innerText = data.cat;
            placeImg.src = data.img;
            
            // Remove previous color classes and add new one
            placeCat.className = `${data.color} text-on-primary-fixed px-3 py-1 rounded-full text-label-sm uppercase tracking-wider mb-2 inline-block`;

            bottomSheet.classList.remove('translate-y-full');
            bottomSheet.classList.add('translate-y-0');
        }

        // Close bottom sheet when clicking elsewhere (on the map area)
        document.querySelector('main').addEventListener('click', (e) => {
            if (!bottomSheet.contains(e.target) && !e.target.closest('[id^="marker-"]')) {
                bottomSheet.classList.add('translate-y-full');
                bottomSheet.classList.remove('translate-y-0');
            }
        });

        // Drag simulation for bottom sheet
        let startY = 0;
        bottomSheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        bottomSheet.addEventListener('touchmove', (e) => {
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY > 50) {
                bottomSheet.classList.add('translate-y-full');
                bottomSheet.classList.remove('translate-y-0');
            }
        });
    </script>
