<style>
        .floating-label-group {
            position: relative;
        }
        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            top: -0.5rem;
            left: 0.75rem;
            font-size: 0.75rem;
            background-color: white;
            padding: 0 0.25rem;
            color: #ff6b35;
        }
        .floating-label-group label {
            position: absolute;
            top: 1rem;
            left: 1rem;
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
        .glass-bg {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center overflow-x-hidden">
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute top-[40%] -right-[5%] w-[30%] h-[30%] bg-tertiary-container/10 rounded-full blur-[100px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[440px] px-margin-mobile md:px-lg flex flex-col items-center justify-center min-h-screen py-xl">
<!-- Brand Logo Area -->
<header class="flex flex-col items-center mb-xxl text-center">
<div class="w-20 h-20 bg-primary-container rounded-[24px] flex items-center justify-center shadow-lg mb-md">
<span class="material-symbols-outlined text-[48px] text-white" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">ChillPlace</h1>
</header>
<!-- Welcome Text -->
<section class="w-full mb-xl text-center md:text-left">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Chào mừng trở lại!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Hãy đăng nhập để tiếp tục hành trình khám phá.</p>
</section>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="return false">
<!-- Email Input -->
<div class="floating-label-group">
<input class="w-full h-14 px-md rounded-xl border-outline text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container bg-surface-container-lowest transition-all" id="email" placeholder=" " type="email"/>
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
</div>
<!-- Password Input -->
<div class="floating-label-group">
<input class="w-full h-14 px-md rounded-xl border-outline text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container bg-surface-container-lowest transition-all" id="password" placeholder=" " type="password"/>
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Mật khẩu</label>
<button class="absolute right-md top-4 text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Quên mật khẩu?</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 mt-sm bg-primary-container text-white font-headline-md text-headline-md rounded-xl shadow-[0px_8px_24px_rgba(255,107,53,0.15)] active:scale-[0.98] transition-transform duration-150">
                Đăng nhập
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-xl">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="mx-md font-label-sm text-label-sm text-on-surface-variant">Hoặc đăng nhập bằng</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Login Options -->
<div class="w-full flex flex-col md:flex-row gap-md">
<button class="flex-1 h-14 flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors shadow-sm">
<div class="w-6 h-6 flex items-center justify-center">

<span class="font-label-md text-label-md text-on-surface">Google</span>

</p>

<div class="hidden md:block absolute -right-32 top-1/2 -translate-y-1/2 w-[400px] h-[600px] rotate-6 opacity-40 pointer-events-none">

<img class="w-full h-full object-cover" data-alt="A stylized aerial high-resolution map of a modern coastal city with clean white streets, lush green parks, and vibrant orange markers indicating popular social spots. The overall aesthetic is bright, airy, and high-energy with a professional corporate edge. Sunlight glints off the water, creating a serene but active atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXsbkwzpBi8ZNXGdyfqffp1xbHVTxBDJamfUpx7e66HrfC5C7Vtbz3Fwadls9vFu3G2EBnUzAbLBouOWG_nCVhyIh7PZ7a6uJZCsGZoEfWk9pyutOhSTUqN1oedQQPk8KUu_wNKMOQ-tzHryWYy_YpEoXtBeKmP114KmANalW2nbNpCsREp9GjSioaJ6FYd6lmFiIVJ2-aq-bUzr2pOOEch-0tmCfTG1WJQ4XfSocvjfjBPAOnQgwlB-mo3eqA0DMXwcFRtehIX04"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent"></div>
</div>

</main>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Add subtle hover lift effect to the primary button
        const loginBtn = document.querySelector('button.bg-primary-container');
        loginBtn.addEventListener('mouseenter', () => {
            loginBtn.style.transform = 'translateY(-2px)';
        });
        loginBtn.addEventListener('mouseleave', () => {
            loginBtn.style.transform = 'translateY(0)';
        });
    </script>
