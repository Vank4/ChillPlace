<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff6b35 !important;
            box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e0e3e5;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-xxl">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface shadow-sm flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-sm cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
<span class="font-label-md text-label-md text-primary">Hủy</span>
</div>
<h1 class="font-headline-md text-[20px] text-primary font-bold">Đăng bài mới</h1>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_horiz">more_horiz</span>
</div>
</header>
<main class="max-w-xl mx-auto px-margin-mobile py-lg space-y-lg">
<!-- Media Upload Section -->
<section>
<div class="relative w-full aspect-[4/5] rounded-[24px] overflow-hidden border-2 border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center group cursor-pointer hover:border-primary transition-all duration-300">
<div class="text-center p-xl">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-md shadow-[0px_8px_24px_rgba(255,107,53,0.15)] group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-white text-4xl" data-icon="photo_camera">photo_camera</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Thêm ảnh/video</h3>
<p class="text-on-surface-variant text-body-md opacity-70">Chia sẻ khoảnh khắc chill nhất của bạn</p>
</div>
<!-- Mock image layer (hidden until selected) -->
<div class="absolute inset-0 opacity-0 pointer-events-none bg-black/20 flex items-center justify-center">
<p class="text-white font-bold">Hình ảnh đã chọn</p>
</div>
</div>
</section>
<!-- Post Content Section -->
<section class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Tiêu đề bài viết</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-md font-headline-md text-[18px] transition-colors" placeholder="Nhập tiêu đề ấn tượng..." type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Nội dung review...</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-md font-body-md text-body-md transition-colors resize-none" placeholder="Chia sẻ cảm nhận, không gian, đồ uống..." rows="4"></textarea>
</div>
</section>
<!-- Location Section -->
<section class="space-y-md">
<div class="flex items-center justify-between mb-xs">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[#14B8A6]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<h3 class="font-label-md text-label-md text-on-surface">Gắn thẻ địa điểm</h3>
</div>
</div>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-primary" data-icon="search">search</span>
<input class="w-full bg-surface-container-lowest border border-[#E2E8F0] rounded-full pl-xl pr-md py-md font-body-md transition-all" placeholder="Tìm kiếm quán cafe, studio, điểm check-in..." type="text"/>
</div>
<!-- Map Preview (Asymmetric Layout) -->
<div class="grid grid-cols-12 gap-sm h-32">
<div class="col-span-8 rounded-xl overflow-hidden shadow-sm relative group cursor-pointer">
<img class="w-full h-full object-cover" data-alt="A top-down stylized map of a modern urban neighborhood with vibrant location pins. The visual style is clean and energetic, using a palette of trust blue and primary orange. Soft sunlight filters over the digital map representation, highlighting nearby parks and cafes in a trendy city district." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgKQ_xdBvHxlpY8TK6Nj_9vmWpA_Rtfcz7XD48K7a99Qn8rvkgvChD2WRPuP8UjWvW9GcmB_xVupUWUwO60vkgI9Ssm9FL7rMjgLZV_usC4DHWyQjX8jYJfOhNZ-4DCymPfuPULbnmRfWiWxPxgyqxmRTI7jT66UNr4WqM1Nhs4kJ78ULnH03QDpHUYURw0FCBAmO-CqlHU61zRjeRmgxe1jG0yEVpdknWw_9IvypgfX32RHOgc19VVOdV_BxG507lylfgr9Ssbuo"/>
<div class="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="bg-white/90 px-md py-sm rounded-full text-xs font-bold text-primary">Xem bản đồ</span>
</div>
</div>
<div class="col-span-4 flex flex-col gap-sm">
<div class="flex-1 bg-surface-container rounded-xl flex items-center justify-center cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#14B8A6]" data-icon="my_location">my_location</span>
</div>
<div class="flex-1 bg-[#1F4E79] rounded-xl flex items-center justify-center cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white" data-icon="explore">explore</span>
</div>
</div>
</div>
</section>
<!-- Hashtags Section -->
<section class="space-y-md">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-icon="tag">tag</span>
<h3 class="font-label-md text-label-md text-on-surface">Hashtag</h3>
</div>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full bg-primary-container text-white font-label-md text-label-md shadow-md active:scale-95 transition-all">#ChillPlace</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:border-primary active:scale-95 transition-all">#CafeSgon</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:border-primary active:scale-95 transition-all">#VibeMap</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:border-primary active:scale-95 transition-all">#WeekendVibe</button>
<button class="w-10 h-10 rounded-full border border-dashed border-primary text-primary flex items-center justify-center active:scale-95">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent pt-lg z-40">
<button class="w-full py-md rounded-xl bg-primary-container text-white font-bold text-body-lg shadow-[0px_8px_24px_rgba(255,107,53,0.3)] active:scale-95 transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
            Đăng bài ngay
        </button>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple click effect for suggestion chips
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if (this.classList.contains('bg-surface-container-highest')) {
                    this.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-white', 'shadow-md');
                } else if (this.classList.contains('bg-primary-container') && !this.innerText.includes('Đăng bài ngay')) {
                    this.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                    this.classList.remove('bg-primary-container', 'text-white', 'shadow-md');
                }
            });
        });

        // Input focus effects
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
